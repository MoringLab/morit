services:
  downloader:
    build: .
    restart: unless-stopped
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      COBALT_API_URL: http://cobalt:9000
      COBALT_API_KEY: ${COBALT_API_KEY:-}
      YT_DLP_FORCE_IPV6: ${YT_DLP_FORCE_IPV6:-true}
    ports:
      - "127.0.0.1:${DOWNLOADER_PORT:-8080}:8080"
    volumes:
      - downloader-data:/data
    depends_on:
      cobalt:
        condition: service_healthy
    networks:
      - media

  cobalt:
    image: ghcr.io/imputnet/cobalt:11
    restart: unless-stopped
    init: true
    read_only: true
    environment:
      API_URL: http://cobalt:9000/
      API_PORT: "9000"
      API_LISTEN_ADDRESS: 0.0.0.0
      CORS_WILDCARD: "0"
      NODE_OPTIONS: --dns-result-order=ipv6first
    expose:
      - "9000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:9000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - media

volumes:
  downloader-data:

networks:
  media:
    driver: bridge
    enable_ipv6: true
